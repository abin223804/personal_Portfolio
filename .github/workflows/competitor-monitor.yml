name: Weekly AI Competitor Intelligence & Auto-SEO Update

on:
  schedule:
    # Runs every Monday at 03:30 UTC (09:00 AM IST)
    - cron: '30 3 * * 1'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  monitor-and-auto-update:
    name: AI Competitor Crawl & Direct Main Auto-Update
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Competitor Crawl & Dispatch Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL || 'abinschandran1@gmail.com' }}
        run: node scripts/scrape-competitors.mjs

      - name: Commit & Push Directly to main (No PR Required)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/competitor-insights.json competitor-analysis.json competitor-improvement-report.html
          if ! git diff --staged --quiet; then
            echo "📝 Changes detected in competitor intelligence. Committing directly to main..."
            git commit -m "chore(seo): auto-update competitor intelligence & search insights [skip ci]"
            git push origin main
            echo "🚀 Successfully pushed directly to main! Vercel will deploy automatically."
          else
            echo "ℹ️ No changes in competitor intelligence this run."
          fi

      - name: Notify Google & Bing of Updated Sitemap
        run: |
          echo "📡 Pinging Google sitemap..."
          curl -s -o /dev/null -w "Google response: %{http_code}\n" "https://www.google.com/ping?sitemap=https://www.abinschandran.in/sitemap.xml" || true
          echo "📡 Pinging Bing sitemap..."
          curl -s -o /dev/null -w "Bing response: %{http_code}\n" "https://www.bing.com/ping?sitemap=https://www.abinschandran.in/sitemap.xml" || true

      - name: Upload HTML & JSON Intelligence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: competitor-intelligence-reports
          path: |
            competitor-improvement-report.html
            competitor-analysis.json
            data/competitor-insights.json
          retention-days: 30
